services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - lobby_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      target: backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_URL: redis://redis:6379/0
  frontend:
    build:
      context: .
      target: frontend
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${LOBBY_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  lobby_redis_data:
