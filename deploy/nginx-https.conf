# Shanghai production: mounted only by docker-compose.https.yml.
listen 443 ssl;
ssl_certificate /etc/letsencrypt/live/111.229.79.183/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/111.229.79.183/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:1m;
if ($scheme = http) { return 308 https://111.229.79.183$request_uri; }
