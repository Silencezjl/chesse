map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    location /lobby/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location /bluff-ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location /holdem-ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location = /bluff { return 301 /bluff/; }
    location = /bluff/ {
        add_header Cache-Control "no-cache";
        try_files /bluff/index.html =404;
    }
    location = /bluff/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /bluff/ { try_files $uri $uri/ /bluff/index.html; }
    location = /cheese { return 301 /cheese/; }
    location /cheese/ { try_files $uri $uri/ /cheese/index.html; }
    location = /holdem { return 301 /holdem/; }
    location /holdem/ { try_files $uri $uri/ /holdem/index.html; }
    location /card/ { alias /usr/share/nginx/html/holdem/card/; }
    location /poker_chip/ { alias /usr/share/nginx/html/holdem/poker_chip/; }
    location ~ ^/(?:lobby\.(?:js|css)|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
